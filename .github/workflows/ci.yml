name: CI

# Checagens em cada push/PR. A suíte visual completa permanece no release local,
# mas os testes de integridade leem os chunks versionados diretamente do disco e
# rodam no CI para impedir publicação de totais incoerentes ou cruzamentos quebrados.
#
# Todos os portões usam `if: always()`: eles são independentes entre si e uma
# falha precoce não pode esconder as demais. Entre 13/07 e 27/08/2026 o passo de
# schema reprovou em 75 execuções seguidas e deixou auditoria de emendas,
# cálculos e resiliência dos coletores como `skipped` — o CI ficou vermelho e
# mudo ao mesmo tempo. O resultado final vem do job `resultado`, no fim.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checagens-estaticas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências de validação de dados
        run: python -m pip install -r requirements.txt
      - name: Dependências Node
        run: npm ci

      - name: Sintaxe dos scripts e HTML (check-syntax)
        id: sintaxe
        if: always()
        run: node scripts/check-syntax.mjs

      - name: Integridade de acentos/encoding (check-accents)
        id: acentos
        if: always()
        run: node scripts/check-accents.mjs

      - name: Auditoria de SEO das páginas públicas
        id: seo
        if: always()
        run: node scripts/check-seo.mjs

      - name: Orçamento de desempenho (app.js, style.css, home)
        id: performance
        if: always()
        run: node scripts/check-performance-budget.mjs

      - name: Schemas dos dados publicados
        id: schemas
        if: always()
        run: python painel-cidadao/validar_schemas_dados.py

      - name: Auditoria bloqueante das emendas
        id: emendas
        if: always()
        run: python painel-cidadao/emendas/audit_emendas.py

      - name: Números publicados batem com os dados
        id: numeros
        if: always()
        run: node tests/test_numeros_publicados.mjs

      - name: Afirmações editoriais e contexto do chatbot
        id: editorial
        if: always()
        run: node tests/test_editorial_assertions.mjs

      - name: Integridade dos cálculos e cruzamentos externos
        id: calculos
        if: always()
        run: npx playwright test tests/calculos.spec.js tests/cruzamentos-externos.spec.js --workers=1

      # Precisa de navegador: renderiza as páginas e reprova quando um dado
      # ausente vira "R$ 0,00" ou vaza NaN/undefined para o cidadão.
      - name: Zeros enganosos nas páginas publicadas
        id: zeros
        if: always()
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/zeros-enganosos.spec.js --workers=1

      - name: Resiliência dos coletores e explicabilidade dos cruzamentos
        id: pipeline
        if: always()
        run: npm run test:pipeline

      # Sem isto, `if: always()` faria o job terminar verde mesmo com portão
      # reprovado: o passo final é que define a conclusão.
      - name: Resultado dos portões
        if: always()
        env:
          RESULTADOS: |
            sintaxe=${{ steps.sintaxe.outcome }}
            acentos=${{ steps.acentos.outcome }}
            seo=${{ steps.seo.outcome }}
            performance=${{ steps.performance.outcome }}
            schemas=${{ steps.schemas.outcome }}
            emendas=${{ steps.emendas.outcome }}
            numeros=${{ steps.numeros.outcome }}
            editorial=${{ steps.editorial.outcome }}
            calculos=${{ steps.calculos.outcome }}
            zeros=${{ steps.zeros.outcome }}
            pipeline=${{ steps.pipeline.outcome }}
        shell: bash
        run: |
          set -uo pipefail
          falhou=0
          {
            echo "| Portão | Resultado |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS='=' read -r nome resultado; do
            [ -z "${nome// }" ] && continue
            case "$resultado" in
              success) icone="✅" ;;
              skipped) icone="⏭️" ;;
              *) icone="❌"; falhou=1 ;;
            esac
            echo "| $nome | $icone $resultado |" >> "$GITHUB_STEP_SUMMARY"
            printf '%s %-12s %s\n' "$icone" "$nome" "$resultado"
          done <<< "$RESULTADOS"
          if [ "$falhou" -ne 0 ]; then
            echo "::error::Um ou mais portões de qualidade reprovaram (tabela acima)."
            exit 1
          fi
          echo "Todos os portões passaram."
